name: snapix
description: Taxi app - تطبيق نقل ذكي يجمع المستخدم والسائق
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.0
  equatable: ^2.0.5
  dartz: ^0.10.1

  # Routing
  go_router: ^14.2.7

  # Supabase
  supabase_flutter: ^2.5.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_crashlytics: ^4.1.0
  flutter_local_notifications: ^17.2.2

  # Maps & Location
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  dart_geohash: ^2.0.1

  # Image
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  image_cropper: ^8.0.2

  # Loading & Animation
  shimmer: ^3.0.0

  # UI
  google_fonts: ^6.2.1
  # Toast — نظام الـ feedback الوحيد في التطبيق
  fluttertoast: ^8.2.10

  # Storage & Utils
  shared_preferences: ^2.3.2
  dio: ^5.7.0
  path_provider: ^2.1.4
  connectivity_plus: ^6.0.5
  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # HTTP (Chatbot)
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.3
  # [المرحلة د، البند 15] لاختبار انتقالات AuthBloc دون الحاجة لقاعدة بيانات حية.
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter_native_splash:
  color: "#06090F"
  android: true
  ios: true
  web: false

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  generate: true
  
  assets:
    # ⚠️ [APP-C-01 FIXED] .env removed from assets — secrets must NOT be bundled in APK/IPA.
    # Use --dart-define at build time:
    #   flutter build apk \
    #     --dart-define=SUPABASE_URL=<value> \
    #     --dart-define=SUPABASE_ANON_KEY=<value> \
    #     --dart-define=GOOGLE_MAPS_KEY=<value>
    - assets/images/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
